<!DOCTYPE html>

<html data-app-root="../" lang="es">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Solicitar cita | MediFlow</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=Plus+Jakarta+Sans:wght@700;800&amp;display=swap" rel="stylesheet"/>
<link href="../css/main.css" rel="stylesheet"/>
<link href="../css/pages/agendar.css" rel="stylesheet"/>
</head>
<body data-page="agendar">
<header class="header">
<nav aria-label="Navegación" class="container nav">
<a class="brand" href="../index.html"><span class="brand-mark" data-icon="heart-pulse"></span><span>MediFlow</span></a>
<div class="nav-actions">
<a class="btn ghost" href="../index.html">Inicio</a>
<a class="btn ghost" href="login.html">Iniciar sesión</a>
</div>
</nav>
</header>
<main class="container agendar-page">
<h1 class="dash-title">Agendar cita médica</h1>
<p class="dash-subtitle">Proceso guiado en 6 pasos · disponibilidad consultada desde la base de datos.</p>
<div id="agendar-alert"></div>
<ol class="stepper" id="stepper"></ol>
<div class="agendar-panel" id="step-panel"></div>
<div class="agendar-actions">
<button class="btn outline" id="btn-back" type="button">Atrás</button>
<button class="btn" id="btn-next" type="button">Continuar</button>
</div>
</main>
<aside aria-live="polite" class="chat">
<div class="chat-head"><b>♥</b><span><strong>Asistente MediFlow</strong><small>Versión inicial</small></span><button aria-label="Cerrar chat" class="close-chat">×</button></div>
<div class="chat-body"></div>
<div class="quick chat-quick"><button>Agendar cita</button><button>Iniciar sesión</button><button>Consultar
                turno</button><button>Ver servicios</button></div>
<form class="chat-form"><input aria-label="Mensaje" class="chat-input" placeholder="Escribe tu pregunta..." type="text"/><button class="btn small" type="submit">Enviar</button></form>
</aside>
<button class="chat-trigger" type="button">◌ <span>¿Necesitas ayuda?</span></button>
<script src="../js/main.js" type="module"></script>
</body>
</html>
