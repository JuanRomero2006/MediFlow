<!DOCTYPE html>
<html lang="es" data-app-root="../../">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pantalla de turnos | MediFlow</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../../css/main.css">
  <link rel="stylesheet" href="../../css/layout/dashboard.css">
  <style>
    .turno-board-grid{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(280px,1fr);gap:1.25rem;margin-top:1.5rem}
    .turno-board-card{border:1px solid var(--border-color,#e2e8f0);border-radius:20px;padding:clamp(1.25rem,3vw,2.5rem);background:var(--surface,#fff);box-shadow:0 8px 28px rgba(15,23,42,.06)}
    .turno-board-card h2{margin:.5rem 0;font-size:clamp(1.3rem,2.5vw,2rem)}
    .turno-board-kicker{font-size:.85rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--muted,#64748b)}
    .turno-board-number{font-size:clamp(4rem,10vw,8rem);line-height:1.05;font-weight:800;letter-spacing:-.06em;color:var(--primary,#2563eb)}
    .turno-board-card p{color:var(--muted,#64748b)}
    #turnos-espera{list-style:none;padding:0;margin:1rem 0 0}
    #turnos-espera li{display:grid;grid-template-columns:5rem 1fr auto;align-items:center;gap:.75rem;padding:.9rem 0;border-bottom:1px solid var(--border-color,#e2e8f0)}
    #turnos-espera li strong{font-size:1.2rem;color:var(--primary,#2563eb)}
    #turnos-espera li small{color:var(--muted,#64748b)}
    .turno-board-empty{grid-template-columns:1fr!important;color:var(--muted,#64748b)}
    .turno-board-footer{display:flex;justify-content:space-between;gap:1rem;align-items:center;margin-top:1rem;color:var(--muted,#64748b);font-size:.9rem}
    @media(max-width:760px){.turno-board-grid{grid-template-columns:1fr}}
  </style>
</head>
<body class="dash-shell" data-page="recepcion:Pantalla de turnos">
  <header class="dash-header"><div class="container dash-header-inner">
    <a class="brand" href="../../index.html"><span class="brand-mark">♥</span><span>MediFlow<span class="dash-brand-sub">Pantalla de turnos</span></span></a>
    <div class="nav-actions"><span class="dash-user" data-user-name></span><button type="button" class="btn outline small dash-menu-toggle" data-dash-menu-toggle aria-expanded="false">Menú</button><button type="button" class="btn outline small" data-logout>Salir</button></div>
  </div><div class="container dash-mobile-nav" data-dash-mobile-nav><nav class="dash-nav" data-dashboard-nav></nav></div></header>
  <div class="container dash-layout"><aside class="dash-sidebar"><nav class="dash-nav" data-dashboard-nav></nav></aside><main class="dash-main">
    <div id="page-alert"></div><section><h1 class="dash-title">Llamado de pacientes</h1><p class="dash-subtitle">La pantalla se actualiza automáticamente cada 10 segundos.</p></section>
    <div class="turno-board-grid"><section class="turno-board-card"><div class="turno-board-kicker">Turno llamado</div><div id="turno-actual" aria-live="polite"><p>Cargando turnos…</p></div></section>
    <section class="turno-board-card"><div class="turno-board-kicker">Próximos pacientes</div><h2>En espera</h2><ul id="turnos-espera"><li class="turno-board-empty">Cargando turnos…</li></ul></section></div>
    <div class="turno-board-footer"><span>Clínica Previred · MediFlow</span><span id="turnos-actualizados">Conectando…</span></div>
  </main></div><script type="module" src="../../js/main.js"></script>
</body></html>
